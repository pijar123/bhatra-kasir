name: Jaga database tetap aktif
# Supabase gratis menidurkan proyek yang sepi 7 hari. Ini membaca 1 baris tiap hari agar tetap aktif.
on:
  schedule:
    - cron: "17 2,14 * * *"   # 09.17 & 21.17 WIB
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Baca pengaturan warung
        run: |
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" "https://wtmzvxmghlwukjwfvpmp.supabase.co/rest/v1/settings?select=id&limit=1" -H "apikey: sb_publishable_HnF1K96NVO6zV6SiKpy7qw_8lu9rRfL")
          echo "HTTP $code"; cat /tmp/r.json; echo
          test "$code" = "200"
