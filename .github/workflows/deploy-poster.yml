name: Kirim aplikasi Poster ke bhatra.id
# Tiap ada perubahan di folder web/poster (branch main), file dikirim ke hosting hPanel lewat FTP.
# Isi sekali di GitHub → Settings → Secrets and variables → Actions:
#   Secrets  : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (dari hPanel → File → Akun FTP)
#   Variable : FTP_DIR (opsional, bawaan "poster/" — akun FTP Hostinger sudah langsung masuk ke public_html)
on:
  push:
    branches: [main]
    paths: ["web/poster/**", ".github/workflows/deploy-poster.yml"]
  workflow_dispatch:
jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - name: Cek data FTP
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Secret FTP_SERVER / FTP_USERNAME / FTP_PASSWORD belum diisi (Settings → Secrets and variables → Actions)."; exit 1
          fi
      - uses: actions/checkout@v4
      - name: Kirim ke hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/poster/
          server-dir: ${{ vars.FTP_DIR || 'poster/' }}
      - name: Cek halaman bisa dibuka
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "https://bhatra.id/poster/")
          echo "https://bhatra.id/poster/ → HTTP $code"
          [ "$code" = 200 ] || echo "::warning::Halaman belum bisa dibuka (HTTP $code). Cek FTP_DIR: folder poster harus ada di dalam public_html situs bhatra.id."
