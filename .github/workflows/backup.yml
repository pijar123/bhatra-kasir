name: Backup database harian
# Salin database Supabase (skema public + auth) tiap malam, dienkripsi, disimpan 30 hari sebagai artifact.
# Repo ini publik, jadi file WAJIB terenkripsi. Butuh 2 secret:
#   SUPABASE_DB_URL  : Supabase → Connect → Session pooler (postgresql://postgres.xxx:PASSWORD@aws-...pooler.supabase.com:5432/postgres)
#   BACKUP_PASSWORD  : kata sandi bebas yang panjang; simpan di tempat aman, tanpa ini backup tidak bisa dibuka.
# Cara memulihkan: lihat RESTORE di bawah.
on:
  schedule:
    - cron: "23 19 * * *"   # 02.23 WIB
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Cek secret
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PW: "${{ secrets.BACKUP_PASSWORD }}" }
        run: |
          if [ -z "$DB" ] || [ -z "$PW" ]; then echo "::error::Secret SUPABASE_DB_URL / BACKUP_PASSWORD belum diisi (Settings → Secrets and variables → Actions)"; exit 1; fi
          if [ ${#PW} -lt 16 ]; then echo "::error::BACKUP_PASSWORD minimal 16 karakter"; exit 1; fi
      - name: Pasang pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y postgresql-client-17 >/dev/null
      - name: Dump + enkripsi
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", BACKUP_PASSWORD: "${{ secrets.BACKUP_PASSWORD }}" }
        run: |
          set -o pipefail
          F=backup-$(TZ=Asia/Jakarta date +%Y%m%d-%H%M).sql.gz.enc
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --schema=auth --no-owner --no-privileges \
            | gzip -9 | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSWORD -out "$F"
          # Uji: bisa dibuka & berisi tabel pesanan
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSWORD -in "$F" | gunzip | grep -q "COPY public.orders"
          echo "FILE=$F" >> "$GITHUB_ENV"; ls -l "$F" | awk '{print "Ukuran:", $5, "byte"}'
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.FILE }}", path: "${{ env.FILE }}", retention-days: 30, compression-level: 0 }
# RESTORE (di komputer dengan PostgreSQL 17):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup-XXXX.sql.gz.enc | gunzip > backup.sql
#   Lalu buka backup.sql dan jalankan bagian yang dibutuhkan di Supabase SQL Editor (atau psql ke proyek baru).
