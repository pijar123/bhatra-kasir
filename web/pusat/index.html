<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin pusat</title>
<meta name="theme-color" content="#3A1E12">
<link rel="icon" href="img/owner-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="admin.css">
<style>
  .sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
  .sum div{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
  .sum p{margin:0;color:var(--muted);font-size:12px;font-weight:700}.sum b{font:800 22px var(--fd)}
  @media (max-width:520px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .shop{margin-top:12px}.shop h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .shop h3 small{font:600 13px var(--fb);color:var(--muted)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:6px 0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .dz{width:min(1100px,100vw - 16px);max-height:calc(100dvh - 16px);border:2px solid var(--ink);border-radius:20px;padding:16px;background:var(--cream);color:var(--ink)}
  .dz::backdrop{background:rgba(58,30,18,.5)}
  .dz-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
  .dz-grid iframe{width:100%;height:min(720px,80dvh);border:2px solid var(--ink);border-radius:18px;background:#fff}
  .dz select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;background:#fff;margin-top:6px;font-weight:600}
  .dz .check{display:flex;gap:10px;align-items:center;font-weight:700;margin:12px 0}
  .dz .check input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--red)}
  .dz .check input[type=color]{width:56px;height:38px;padding:2px;margin:0;flex:none;border-radius:10px}
  @media (max-width:820px){.dz-grid{grid-template-columns:1fr}.dz-grid iframe{height:560px}}
</style>
</head>
<body>
<div id="loginView" class="wrap" hidden>
  <div class="card" style="margin-top:48px">
    <h1>Admin pusat</h1>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" hidden></p>
      <button class="btn btn-red" type="submit">Masuk</button>
    </form>
  </div>
</div>
<div id="appView" hidden>
  <header class="top"><div class="wrap bar"><h1>Admin pusat</h1><button class="x" id="logout" type="button" aria-label="Keluar" title="Keluar">⎋</button></div></header>
  <main class="wrap" style="padding-bottom:48px">
    <div class="sum" id="sum"></div>
    <div id="errs" style="margin-bottom:8px"></div>
    <div class="filters" role="group" aria-label="Saring">
      <button type="button" class="chip" data-f="semua" aria-pressed="true">Semua</button>
      <button type="button" class="chip" data-f="coba" aria-pressed="false">Masa coba</button>
      <button type="button" class="chip" data-f="bayar" aria-pressed="false">Berbayar</button>
      <button type="button" class="chip" data-f="mati" aria-pressed="false">Tidak aktif</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="pantau.js"></script>
<script src="themes.js"></script>
<script src="pusat/pusat.js"></script>
<dialog id="dzDialog" class="dz"><div id="dzBody"></div></dialog>
</body>
</html>
