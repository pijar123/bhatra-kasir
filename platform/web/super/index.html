<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="platform.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
  .shoprow{display:grid;gap:6px}
  .shoprow .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .ext{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
  .ext input,.ext select{margin:0}
</style>
</head>
<body data-app="admin">
<div id="loginView" class="wrap" hidden>
  <div class="card" style="margin-top:48px"><h1>Admin platform</h1>
    <form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label>
    <p class="err" id="loginErr" hidden></p><button class="btn btn-red" type="submit">Masuk</button></form></div>
</div>
<div id="appView" hidden>
  <header class="top"><div class="wrap bar"><h1>Admin platform</h1><button class="x" id="logout" type="button" aria-label="Keluar">⎋</button></div>
    <nav class="wrap tabs" role="tablist">
      <button role="tab" data-f="semua" aria-selected="true">Semua</button>
      <button role="tab" data-f="coba" aria-selected="false">Masa coba</button>
      <button role="tab" data-f="bayar" aria-selected="false">Berbayar</button>
      <button role="tab" data-f="habis" aria-selected="false">Habis</button>
    </nav></header>
  <main class="wrap" id="panel"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="super/super.js"></script>
</body>
</html>
