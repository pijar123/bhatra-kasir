<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard Toko</title>
<meta name="theme-color" content="#3A1E12">
<link rel="icon" href="img/icon-owner.svg">
<link rel="manifest" href="owner.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="platform.css">
</head>
<body data-app="admin">
<div class="install" id="installBar" hidden>
  <img src="img/icon-owner.svg" alt="" width="44" height="44">
  <span><b>Pasang dashboard di HP</b><small id="installHint">Buka pesanan langsung dari layar utama</small></span>
  <button type="button" class="chip" data-install>Pasang</button>
  <button type="button" class="x" id="installX" aria-label="Tutup">×</button>
</div>
<div id="loginView" class="wrap" hidden>
  <div class="card" style="margin-top:48px">
    <h1 style="margin-top:4px">Masuk ke dashboard toko</h1>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" hidden></p>
      <button class="btn btn-red" type="submit">Masuk</button>
    </form>
    <p style="margin:14px 0 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><button type="button" class="linkbtn" id="forgot">Lupa password</button><a href="/daftar.html" style="font-weight:800">Belum punya toko? Daftar gratis</a></p>
  </div>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="wrap bar">
      <h1 id="shopTitle">Toko</h1>
      <select id="shopSwitch" aria-label="Pilih toko" hidden></select>
      <label class="switch"><input type="checkbox" id="openToggle"><span>Buka</span></label>
      <button class="x" id="logout" type="button" aria-label="Keluar" title="Keluar">⎋</button>
    </div>
    <nav class="wrap tabs" role="tablist">
      <button role="tab" data-tab="aktif" aria-selected="true">Aktif <span id="cAktif" class="count"></span></button>
      <button role="tab" data-tab="selesai" aria-selected="false">Selesai</button>
      <button role="tab" data-tab="menu" aria-selected="false">Menu</button>
      <button role="tab" data-tab="rekap" aria-selected="false">Rekap</button>
      <button role="tab" data-tab="atur" aria-selected="false">Atur</button>
    </nav>
  </header>
  <main class="wrap" id="panel"></main>
</div>

<footer><p><b>Dashboard toko</b> · <a href="/home.html" id="brandLink">tentang</a> · <a href="/privasi.html">privasi</a> · <a href="/syarat.html">syarat</a></p><p><a href="#" data-install style="font-weight:800">Pasang dashboard di HP</a></p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="config.js"></script>
<script src="qris.js"></script>
<script src="admin.js"></script>
<script src="install.js"></script>
<script>document.getElementById('brandLink').textContent = CONFIG.BRAND;</script>
</body>
</html>
